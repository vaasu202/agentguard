model_list:
  - model_name: agentguard-primary
    litellm_params:
      model: openai/${OPENAI_DEFAULT_MODEL}
      api_key: os.environ/OPENAI_API_KEY

  - model_name: agentguard-vllm
    litellm_params:
      model: openai/${VLLM_MODEL}
      api_base: os.environ/VLLM_BASE_URL
      api_key: os.environ/VLLM_API_KEY

router_settings:
  routing_strategy: latency-based-routing
  num_retries: 2
  allowed_fails: 1
  cooldown_time: 30

litellm_settings:
  drop_params: true
  redact_user_api_key_info: true
  set_verbose: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
